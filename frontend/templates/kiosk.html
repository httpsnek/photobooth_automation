<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>{{ booth_name }}</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body
  data-attract-video="{{ attract_video }}"
  data-paid-video="{{ paid_video }}"
  data-qr-left="{{ qr_left_pct }}"
  data-qr-top="{{ qr_top_pct }}"
  data-qr-size="{{ qr_size_pct }}"
  data-qr-height="{{ qr_height_pct }}"
  data-qr-radius="{{ qr_radius_pct }}"
  data-price="{{ price }}"
  data-shots="{{ shots }}"
  data-session-duration="{{ session_duration }}"
  data-shot-countdown="{{ shot_countdown }}"
  data-support-phone="{{ support_phone }}">

  <!-- ── Video layer: the client's branded animation, shown for AWAITING_PAYMENT
       and PAID when a video file is configured. The live QR is a real element
       laid over the video, never baked in. ─────────────────────────────────── -->
  <div id="video-stage" hidden>
    <div id="video-box">
      <video id="clip" muted playsinline preload="auto"></video>
      <div id="qr-overlay" hidden><img id="qr-overlay-img" alt="QR-код для оплати"></div>
    </div>
  </div>

  <!-- ── HTML layer: fallback if the video can't play, and the UI for every
       state the video doesn't cover (shooting / printing / done / errors). ── -->
  <header class="brand">
    <img src="/static/img/logo.png" alt="InstaBOX" class="logo"
         onerror="this.remove();document.getElementById('logo-fallback').hidden=false">
    <div id="logo-fallback" class="logo-fallback" hidden>
      <span class="lf-insta">Insta</span><span class="lf-box">BOX</span>
    </div>
  </header>

  <div id="flash" aria-hidden="true"></div>

  <main id="screen">

    <!-- one badge: morphs its icon, or shows the per-shot countdown number -->
    <div id="badge" class="badge" hidden>
      <morph-icon id="badge-icon" stroke-width="1.5" absolute-stroke-width
                  spring="smooth" reduced-motion="never"></morph-icon>
      <span id="countdown-num" hidden></span>
    </div>
    <div id="loader" class="loader" hidden></div>

    <div id="copy" class="copy" hidden>
      <h1 id="headline" class="headline"></h1>
      <p id="subtext" class="muted" hidden></p>
      <div id="shots-progress" class="shots-progress" hidden></div>
      <p id="support" class="support" hidden></p>
    </div>

    <!-- AWAITING_PAYMENT keeps its own richer layout (pricing + QR) -->
    <section id="awaiting" class="screen" hidden>
      <div class="pricing">
        <span class="pricing__shots"><span id="shots-price">{{ shots }}</span> фото</span>
        <span class="pricing__sep"></span>
        <span class="pricing__price"><span id="price-value">{{ price }}</span> грн</span>
      </div>
      <h1 class="headline">Відскануй QR-код<br>для оплати</h1>
      <div class="qr-frame"><img id="qr" alt="QR-код для оплати" /></div>
      <p class="foot">Наведи камеру телефона на QR-код<br>та оплати фотосесію</p>
    </section>

  </main>

  <div id="timer" class="timer" hidden></div>

  <script src="/static/vendor/morphicons.js"></script>
  <script src="/static/js/kiosk.js"></script>
</body>
</html>
